[project]
name = "postflight"
version = "0.1.0"
description = "postflight: burn Walksnail Avatar .osd overlays onto MP4 video"
requires-python = ">=3.11,<3.12"
dependencies = [
    "av==17.1.0",
    "pillow==12.3.0",
]

[project.scripts]
postflight = "postflight:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["postflight"]
